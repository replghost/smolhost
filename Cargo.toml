[package]
name = "polkadot-host"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/replghost/polkadot-host"
description = "Experimental shared Polkadot light-client service for Linux"
publish = false

[dependencies]
anyhow = "1"
async-net = "2"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
futures-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
futures-util = { version = "0.3", features = ["sink"] }
log = "0.4"
pin-project = "1"
rustix = { version = "1", features = ["process"] }
serde_json = "1"
smoldot = { version = "=6.0.0", default-features = false, features = ["std"] }
smoldot-light = "=4.0.0"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.28"
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"
