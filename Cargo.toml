[package]
name = "smolhost"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/replghost/smolhost"
description = "Independent shared Polkadot light-client service, powered by smoldot"
publish = false

[dependencies]
anyhow = "1"
async-net = "2"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
futures-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
futures-util = { version = "0.3", features = ["sink"] }
listenfd = "1"
log = "0.4"
pin-project = "1"
rustix = { version = "1", features = ["process", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
smoldot = { version = "=6.0.0", default-features = false, features = ["std"] }
smoldot-light = "=4.0.0"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.28"
webpki-roots = "1"
